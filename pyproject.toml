[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandata"
version = "0.2.1"
description = "The mandate toolkit for agent-initiated payments"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Shedrack Chiedozie Aji", email = "shedrack.aji@doztra.ai"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security :: Cryptography",
]
dependencies = ["pynacl>=1.5"]

[project.urls]
Homepage = "https://github.com/ashedrack/mandata"
Documentation = "https://github.com/ashedrack/mandata/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
